name: Gerar APK Bancada Jarvis
on:
  push:
    branches:
      - bancada-jarvis-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Descompactar código Android
        run: |
          base64 --decode Bancada_Jarvis_Android/source.tar.xz.b64 | tar -xJf -
          test -f Bancada_Jarvis_Android/app/src/main/java/com/bancada/jarvis/MainActivity.java
          sed -i 's/import android.app.PrintManager;/import android.print.PrintManager;/' Bancada_Jarvis_Android/app/src/main/java/com/bancada/jarvis/MainActivity.java

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar SDK do runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Instalar plataforma e build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste
        working-directory: Bancada_Jarvis_Android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bancada-Jarvis-APK
          path: Bancada_Jarvis_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
