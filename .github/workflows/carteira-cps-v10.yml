name: Carteira CPS V10 - APK
on:
  push:
    branches: [carteira-cps-v10]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Preparar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Montar projeto e interface premium
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, gzip, tarfile, lzma, io
          archive = lzma.decompress(base64.b64decode(Path('carteira-cps-v8-source.tar.xz.b64').read_text().strip()))
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:') as tf:
              tf.extractall('android',filter='data')
          root = Path('android')
          assets = root/'app/src/main/assets'
          site = root/'site'
          site.mkdir(exist_ok=True)
          html = gzip.decompress(base64.b64decode(Path('carteira-cps-v9-ui.html.gz.b64').read_text().strip()))
          html = html.decode('utf-8').replace('</head>', '<style>:root{--bg:#141518;--surface:#212226;--surface2:#292b30;--line:#414248;--ink:#f3f3f5;--sub:#b9b9c0;--soft:#d3d3d8;--red:#bd243b;--coral:#ffb1ba;--mint:#e7e7ef;--mint2:#f5f5f9;--ease:cubic-bezier(.2,.8,.2,1)}
body{background:var(--bg);letter-spacing:0;font-family:Roboto,system-ui,sans-serif}.app:before,.app:after,.hero-glow,.orbit,.card-orb2{display:none}.topline{height:3px;background:#b21f35;box-shadow:none}.masthead{padding:22px 0}.brand-logo{box-shadow:none;border-radius:10px}.brand-name{font-weight:650;letter-spacing:-.02em}.brand-eyebrow,.eyebrow,.section-label{letter-spacing:.06em}.eyebrow:before{display:none}.hero h1{font-weight:650;font-size:36px;letter-spacing:-.035em}.hero h1 em{color:var(--ink);background:none;-webkit-text-fill-color:currentColor}.glass-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:none;backdrop-filter:none}.textinput{background:#17181b;border-color:#55565e}.textinput:focus{border-color:#e2b8bf;box-shadow:none}.button-main{background:#eab8c0;color:#351018;box-shadow:none;border-radius:28px;font-weight:650}.button-alt{border-radius:28px}.panel-icon,.circle-btn,.pill-small{background:#292a30;border-color:#44454c}.live-dot{background:#a5d6a7;box-shadow:none;animation:none}.sample-card{background:#92263a;border:1px solid #c05c6b;box-shadow:0 16px 28px #0005;animation:heroCard 7s ease-in-out infinite}.sample-card:after{display:none}.welcome-title{font-weight:650;letter-spacing:-.04em}.wallet-card{border-radius:18px;background:linear-gradient(124deg,#9b2338 0%,#a8273d 68%,#752032 68%,#752032 100%);border:1px solid #c26c78;box-shadow:0 12px 24px #0005;transition:transform .4s cubic-bezier(.18,1.3,.35,1),box-shadow .3s;touch-action:pan-y}.wallet-card:hover{box-shadow:0 15px 26px #0006}.wallet-card:before{background:linear-gradient(118deg,transparent 65%,#ffffff12 65%,#ffffff12 66%,transparent 66%);opacity:1}.wallet-card:after{animation:none;opacity:0;transition:opacity .2s}.wallet-card.cps-touch:after{opacity:1;animation:glint 1s ease-out both}.wallet-card.cps-touch{transform:rotateX(var(--rotX,0deg)) rotateY(var(--rotY,0deg)) scale(.98)}.card-orb{display:none}.card-inner{transform:none}.institution-mark .logo{box-shadow:none;border-radius:6px}.stage{animation:cpsEnter .65s cubic-bezier(.2,1.15,.35,1) both}@keyframes cpsEnter{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}button{transition:transform .25s cubic-bezier(.18,1.25,.35,1),background .2s}button:active{transform:scale(.96)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}</style></head>').replace('</body>', '<script>(()=>{const c=document.getElementById('walletCard');if(!c)return;const reset=()=>{c.classList.remove('cps-touch');c.style.setProperty('--rotX','0deg');c.style.setProperty('--rotY','0deg')};c.addEventListener('pointerdown',()=>{c.classList.add('cps-touch')});window.addEventListener('pointerup',reset);window.addEventListener('pointercancel',reset);c.addEventListener('pointerleave',reset);})();</script></body>').encode('utf-8')
          (assets/'index.html').write_bytes(html)
          (site/'index.html').write_bytes(html)
          imgbytes = base64.b64decode(Path('carteira-cps-v9-cps-icon-192.png.b64').read_text().strip())
          orig = Image.open(io.BytesIO(imgbytes)).convert('RGBA')
          for size in [192,512]:
              image=orig.resize((size,size),Image.Resampling.LANCZOS)
              image.save(assets/f'icon-{size}.png',optimize=True)
              image.save(site/f'icon-{size}.png',optimize=True)
          for folder, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              path=root/f'app/src/main/res/mipmap-{folder}'
              path.mkdir(parents=True,exist_ok=True)
              im=orig.resize((size,size),Image.Resampling.LANCZOS)
              for filename in ['ic_launcher.png','ic_launcher_round.png']:
                  im.save(path/filename,optimize=True)
          manifest='{"name":"Carteira Digital CPS","short_name":"Carteira CPS","description":"Carteira institucional digital do projeto TCC","start_url":"./index.html","scope":"./","display":"standalone","background_color":"#071015","theme_color":"#071015","icons":[{"src":"icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},{"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'
          (assets/'manifest.webmanifest').write_text(manifest)
          (site/'manifest.webmanifest').write_text(manifest)
          sw=(assets/'sw.js').read_text().replace('carteira-cps-shell-v8','carteira-cps-shell-v10')
          (assets/'sw.js').write_text(sw)
          (site/'sw.js').write_text(sw)
          main = root/'app/src/main/java/br/edu/tcc/carteiracps/MainActivity.kt'
          k=main.read_text()
          k=k.replace('import android.app.Activity','import android.app.Activity\nimport android.graphics.Color')
          k=k.replace('        auth = FirebaseAuth.getInstance()', '''        window.statusBarColor = Color.rgb(20, 21, 24)
                  window.navigationBarColor = Color.rgb(20, 21, 24)
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = 0
                  auth = FirebaseAuth.getInstance()''')
          k=k.replace('            settings.javaScriptEnabled = true', '            setBackgroundColor(Color.rgb(20, 21, 24))\n            settings.javaScriptEnabled = true')
          main.write_text(k)
          gradle = root/'app/build.gradle.kts'
          g=gradle.read_text().replace('versionCode = 8', 'versionCode = 10').replace('versionName = "8.0-webapp"','versionName = "10.0"')
          gradle.write_text(g)
          print('Premium UI, CPS logo, Firebase Android e site PWA montados.')
          PY
      - name: Compilar APK V10
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Certificado de assinatura Android
        working-directory: android
        run: gradle --no-daemon :app:signingReport
      - name: Validar arquivo APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Carteira-CPS-V10.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Carteira-CPS-V10-APK
          path: Carteira-CPS-V10.apk
          if-no-files-found: error