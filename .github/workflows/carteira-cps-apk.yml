name: Carteira CPS - compilar APK
on:
  push:
    branches:
      - carteira-cps-apk
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Expandir projeto
        shell: bash
        run: |
          python3 - <<'PY'
          import tarfile,base64,lzma,io,pathlib
          contents=pathlib.Path("carteira-cps-source.tar.xz.b64").read_text().strip()
          raw=lzma.decompress(base64.b64decode(contents))
          with tarfile.open(fileobj=io.BytesIO(raw),mode="r:") as tf:
              tf.extractall("android",filter="data")
          from pathlib import Path
          xml = Path("android/app/src/main/res/xml/apduservice.xml")
          val = xml.read_text()
          val = val.replace('android:description="Carteira CPS experimental"', 'android:description="@string/nfc_service_description"')
          val = val.replace('android:description="Cartão CPS (teste ISO-DEP)"', 'android:description="@string/nfc_group_description"')
          xml.write_text(val)
          strings = Path("android/app/src/main/res/values/strings.xml")
          strings.parent.mkdir(parents=True, exist_ok=True)
          strings.write_text('<?xml version="1.0" encoding="utf-8"?><resources><string name="nfc_service_description">Carteira CPS experimental</string><string name="nfc_group_description">Cartão CPS teste ISO DEP</string></resources>')
          gradle = Path("android/app/build.gradle.kts")
          gradle.write_text(gradle.read_text().replace("firebase-bom:35.0.2", "firebase-bom:33.14.0"))
          print("Arquivos Android extraídos, XML de NFC e versões do Firebase corrigidos")
          PY
      - name: Compilar APK debug
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Carteira-CPS-APK-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
