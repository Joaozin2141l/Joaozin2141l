name: Carteira CPS v8 - APK com site e icone
on:
  push:
    branches: [carteira-cps-apk]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair site e projeto Android
        run: |
          python3 - <<'PY'
          import pathlib,tarfile,lzma,base64,io
          p=pathlib.Path('carteira-cps-v8-source.tar.xz.b64')
          raw=lzma.decompress(base64.b64decode(p.read_text().strip()))
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as tf:
              tf.extractall('android',filter='data')
          icon=pathlib.Path('android/build_assets.py')
          src=icon.read_text()
          src=src.replace("font=ImageFont.truetype('/usr/share/fonts/truetype/lato/Lato-Heavy.ttf',142)","font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',142)")
          icon.write_text(src)
          print('Projeto preparado.')
          PY
      - name: Gerar icones Android e Web
        run: |
          python3 -m pip install --quiet pillow
          python3 android/build_assets.py
          cp android/app/src/main/assets/icon-192.png android/site/icon-192.png
          cp android/app/src/main/assets/icon-512.png android/site/icon-512.png
      - name: Compilar APK debug
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Carteira-CPS-v8-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
